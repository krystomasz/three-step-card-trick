<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Can Guess Your Card</title>

<style>

body{
    margin:0;
    padding:20px;
    text-align:center;
    font-family:Arial, Helvetica, sans-serif;
    background:#ececec;
}

h2{
    margin-top:5px;
}

.piles-container{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.pile{
    position:relative;
}

.cards{
    display:flex;
    justify-content:center;
    margin-bottom:15px;
}

.card{
    width:60px;
    height:90px;
    background:#fff;
    border:1px solid #333;
    border-radius:6px;
    margin-left:-18px;
    position:relative;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.card:first-child{
    margin-left:0;
}

.top-corner{
    position:absolute;
    top:4px;
    left:5px;
    font-size:20px;
    font-weight:bold;
    line-height:18px;
    text-align:center;
}

.center-symbol{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:34px;
}

.bottom-corner{
    position:absolute;
    right:5px;
    bottom:4px;
    transform:rotate(180deg);
    font-size:20px;
    font-weight:bold;
    line-height:18px;
    text-align:center;
}

.red-card{
    color:#d50000;
}

button{
    padding:10px 40px;
    font-size:20px;
    color:#fff;
    background:#2ecc71;
    border:none;
    border-bottom:5px solid #27ae60;
    border-radius:4px;
    cursor:pointer;
}

button:hover{
    transform:translateY(2px);
}

.result{
    margin-top:30px;
}

.large-card{
    width:170px;
    height:240px;
    margin:20px auto;
}

.large-card .top-corner,
.large-card .bottom-corner{
    font-size:42px;
    line-height:36px;
}

.large-card .center-symbol{
    font-size:80px;
}

</style>
</head>
<body>

<button onclick="newGame()">New Deal</button>

<div id="app"></div>

<script>

const deck = [
'A♠','9♠','10♠','J♠','Q♠','K♠',
'A♦','9♦','10♦','J♦','Q♦','K♦',
'A♣','9♣','10♣','J♣','Q♣','K♣',
'A♥','9♥','10♥','J♥','Q♥','K♥'
];

let cards = [];
let step = 1;

function shuffleDeck(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function newGame(){
    cards=[...deck];
    shuffleDeck(cards);
    step=1;
    showFirstRound();
}

function dealCards(deckCards, numberOfPiles){

    const piles=[];

    for(let i=0;i<numberOfPiles;i++){
        piles[i]=[];
    }

    let currentPile=0;

    for(const card of deckCards){

        piles[currentPile].push(card);

        currentPile++;

        if(currentPile===numberOfPiles){
            currentPile=0;
        }
    }

    piles.forEach(pile => pile.reverse());

    return piles;
}

function renderCard(card, large=false){

    const rank = card.slice(0,-1);
    const suit = card.slice(-1);

    const isRed = suit==='♥' || suit==='♦';

    return `
        <div class="card ${isRed ? 'red-card' : ''} ${large ? 'large-card' : ''}">
            <div class="top-corner">${rank}<br>${suit}</div>
            <div class="center-symbol">${suit}</div>
            <div class="bottom-corner">${rank}<br>${suit}</div>
        </div>
    `;
}

function renderPiles(piles, callback){

    let html='<div class="piles-container">';

    piles.forEach((pile,index)=>{

        html+=`
        <div class="pile">
            <div class="cards">
                ${pile.map(card => renderCard(card)).join('')}
            </div>
            <button onclick="${callback}(${index})">
                Choose
            </button>
        </div>
        `;
    });

    html+='</div>';

    document.getElementById('app').innerHTML += html;
}

let round1Piles = [];
let round2Piles = [];
let round3Piles = [];

function showFirstRound(){

    round1Piles = dealCards(cards,4);

    document.getElementById('app').innerHTML=`
        <h2>I can guess your card in just three steps...</h2>
        <p>Select the pile containing your card.</p>
    `;

    renderPiles(round1Piles,'selectFirstPile');
}

function selectFirstPile(selectedPile){

    let mergedPile=[...round1Piles[selectedPile]];

    round1Piles.forEach((pile,index)=>{
        if(index!==selectedPile){
            mergedPile=mergedPile.concat(pile);
        }
    });

    round2Piles=dealCards(mergedPile,3);

    document.getElementById('app').innerHTML=`
        <h2>Keep thinking about your card...</h2>
    `;

    renderPiles(round2Piles,'selectSecondPile');
}

function selectSecondPile(selectedPile){

    let mergedPile=[...round2Piles[selectedPile]];

    round2Piles.forEach((pile,index)=>{
        if(index!==selectedPile){
            mergedPile=mergedPile.concat(pile);
        }
    });

    round3Piles=dealCards(mergedPile,2);

    document.getElementById('app').innerHTML=`
        <h2>I'm almost there...</h2>
    `;

    renderPiles(round3Piles,'selectFinalPile');
}

function selectFinalPile(selectedPile){

    const pile = round3Piles[selectedPile];

    const guessedCard = pile[8];

    document.getElementById('app').innerHTML=`
        <div class="result">
            <h2>The card you're thinking of is:</h2>
            ${renderCard(guessedCard,true)}
            <button onclick="newGame()">Play Again</button>
        </div>
    `;
}

newGame();

</script>

</body>
</html>
